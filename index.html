<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Sheet Splitter & Uploader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; margin-bottom: 20px; color: #4f46e5; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #cbd5e1; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #4f46e5; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        #status { margin-top: 15px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sprite Uploader</h2>
    
    <label for="category">Categoria:</label>
    <select id="category">
        <option value="companion">Companion</option>
        <option value="png">PNG</option>
        <option value="personaggiprincipale">Protagonista</option>
    </select>

    <label for="spriteName">Nome Sprite:</label>
    <input type="text" id="spriteName" placeholder="es. ash">

    <label for="imageFile">Immagine (griglia 2x2):</label>
    <input type="file" id="imageFile" accept="image/*">

    <button onclick="processAndUpload()">Carica su Supabase</button>
    
    <div id="status"></div>
</div>

<!-- SDK di Supabase per Browser -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
