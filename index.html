<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Sheet Splitter & Uploader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 800px; width: 100%; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 380px; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 20px; color: #4f46e5; font-size: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #cbd5e1; }
        input, select, button, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 110px; font-size: 11px; line-height: 1.4; color: #94a3b8; }
        button { background: #4f46e5; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .btn-download { background: #059669; }
        .btn-download:hover { background: #047857; }
        .btn-gemini { background: #db2777; }
        .btn-gemini:hover { background: #be185d; }
        #status { margin-top: 15px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Pannello Helper / Prompt per Gemini -->
    <div class="card">
        <h2>Prompt Generazione</h2>
        <label for="promptText">Prompt ufficiale per i personaggi:</label>
        <textarea id="promptText" readonly>Genera un foglio di sprite per un personaggio in pixel art in stile retro 16-bit (ispirato ai classici giochi Pokémon).
SPECIFICHE TECNICHE RIGOROSE:

Canvas e Layout: Una griglia uniforme 2x2 contenente esattamente 4 pose direzionali distinte (Frontale, Posteriore, Profilo Sinistro, Profilo Destro) perfettamente centrate nel foglio.
Dimensioni dello Sprite: Ciascun singolo sprite deve misurare rigorosamente 64x64 pixel.
Posizioni Fisse (Obbligatorie per l'automazione):
Cella in alto a sinistra: Vista FRONT (frontale).
Cella in alto a destra: Vista BACK (posteriore, postura dritta e simmetrica, nessuna distorsione).
Cella in basso a sinistra: Vista LEFT (profilo sinistro).
Cella in basso a destra: Vista RIGHT (profilo destro speculare o coerente).
Palette di Colori: Estetica retro gaming a 16-bit con palette cromatica limitata e coerente.
Sfondo e Formattazione: Sfondo a tinta unita assoluta (es. verde chroma puro #00FF00 o magenta puro #FF00FF) SENZA griglie, SENZA linee guida, SENZA etichette di testo (rimuovi qualsiasi scritta Front, Back, ecc.) e SENZA filigrane. L'immagine deve essere perfettamente pulita per facilitare script di ritaglio automatizzati.</textarea>
        <button class="btn-gemini" onclick="copyAndOpenGemini()">Copia Prompt & Apri Gemini</button>
    </div>

    <!-- Pannello Uploader Esistente -->
    <div class="card">
        <h2>Sprite Manager</h2>
        
        <label for="category">Categoria:</label>
        <select id="category">
            <option value="companion">Companion</option>
            <option value="png">PNG</option>
            <option value="personaggioprincipale">Protagonista</option>
        </select>

        <label for="spriteName">Nome Sprite:</label>
        <input type="text" id="spriteName" placeholder="es. ash">

        <label for="imageFile">Immagine (griglia 2x2):</label>
        <input type="file" id="imageFile" accept="image/*">

        <button onclick="processAndUpload()">Carica su Supabase</button>
        <button class="btn-download" onclick="downloadLocally()">Scarica Localmente le 4 foto</button>
        
        <div id="status"></div>
    </div>
</div>

<!-- SDK di Supabase per Browser -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
